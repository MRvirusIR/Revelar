name: Release

# Fires when VERSION changes on master (or a v* tag is pushed, or manually).
# It builds cross-platform binaries, creates the matching git tag if needed,
# and publishes a GitHub release with the artifacts and checksums.
on:
  push:
    branches: [ "master" ]
    paths: [ "VERSION" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(tr -d ' \n\r\t' < VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        run: |
          go vet ./...
          go test ./...

      - name: Cross-compile
        run: |
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags="-s -w" -o "dist/Revelar_${os}_${arch}${ext}" .
          done
          cd dist && sha256sum * > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: dist/*
          generate_release_notes: true

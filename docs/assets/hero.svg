<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Revelar — Unmask the real origin IP behind any CDN or WAF">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05080b"/><stop offset=".5" stop-color="#081419"/><stop offset="1" stop-color="#030506"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="38%" r="55%">
    <stop offset="0" stop-color="#19E6C8" stop-opacity=".22"/><stop offset="1" stop-color="#19E6C8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#19E6E6"/><stop offset="1" stop-color="#4DFF9E"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
  <style>
    @keyframes sweep{0%{transform:translateX(-140px)}100%{transform:translateX(1420px)}}
    @keyframes blink{0%,92%,100%{opacity:1}96%{opacity:.25}}
    @keyframes pulse{50%{opacity:.4}}
    .scan{animation:sweep 5.5s linear infinite}
    .eye{animation:blink 4s ease-in-out infinite}
    .g{animation:pulse 3s ease-in-out infinite}
    .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}
    .sans{font-family:'Segoe UI',system-ui,sans-serif}
  </style>
</defs>
<rect width="1280" height="420" fill="url(#bg)"/>
<rect width="1280" height="420" fill="url(#glow)"/>
<!-- faint grid -->
<g stroke="#0d2a2a" stroke-width="1" opacity=".5">
  <path d="M0 60H1280M0 120H1280M0 180H1280M0 240H1280M0 300H1280M0 360H1280"/>
  <path d="M80 0V420M240 0V420M400 0V420M560 0V420M720 0V420M880 0V420M1040 0V420M1200 0V420"/>
</g>
<!-- moving scan line -->
<g class="scan"><rect x="0" y="0" width="120" height="420" fill="url(#cyan)" opacity=".06"/><rect x="118" y="0" width="2" height="420" fill="#19E6E6" opacity=".5"/></g>
<!-- shield + eye emblem -->
<g transform="translate(150 210)">
  <path d="M0 -118 L104 -78 V6 C104 70 58 112 0 132 C-58 112 -104 70 -104 6 V-78 Z" fill="#06100f" stroke="url(#cyan)" stroke-width="3"/>
  <path d="M0 -118 L104 -78 V6 C104 70 58 112 0 132 C-58 112 -104 70 -104 6 V-78 Z" fill="none" stroke="#19E6E6" stroke-width="10" opacity=".12" filter="url(#soft)"/>
  <g class="eye">
    <path d="M-72 6 C-40 -34 40 -34 72 6 C40 46 -40 46 -72 6 Z" fill="#06100f" stroke="url(#cyan)" stroke-width="4"/>
    <circle cx="0" cy="6" r="26" fill="none" stroke="#4DFF9E" stroke-width="4"/>
    <circle cx="0" cy="6" r="11" fill="#19E6E6"/>
    <circle cx="8" cy="-2" r="3.5" fill="#eafffb"/>
  </g>
  <circle cx="0" cy="6" r="92" fill="none" stroke="#19E6E6" stroke-width="1" opacity=".25" class="g"/>
</g>
<!-- wordmark -->
<g transform="translate(310 150)">
  <text class="sans" x="0" y="0" font-size="86" font-weight="800" fill="#eafffb" letter-spacing="2">REVELAR</text>
  <text class="mono" x="4" y="44" font-size="23" fill="#19E6E6" letter-spacing="3">ORIGIN&#160;REVEAL&#160;&#8226;&#160;PRO</text>
  <text class="sans" x="4" y="92" font-size="26" font-weight="600" fill="#AAB7B4">Unmask the real origin IP behind any <tspan fill="#4DFF9E">CDN</tspan> &#183; <tspan fill="#4DFF9E">WAF</tspan></text>
  <g class="mono" font-size="16" fill="#6f8a86" transform="translate(4 134)">
    <text>$ revelar -d target.com -active -deep</text>
    <text y="26" fill="#4DFF9E">[+] origin found  &#8594;  203.0.113.47   score 92/100   ✓ verified</text>
  </g>
</g>
</svg>
